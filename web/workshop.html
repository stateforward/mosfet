<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mosfet workshop</title>
    <meta name="description" content="Build a mosfet bot, give it a real job, correct it once, and watch every run after come back free." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/site/site.css" />
    <style>
      .workshop-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem clamp(16px, 4vw, 48px); max-inline-size: 90rem; margin-inline: auto; }
      .workshop-top .mark { display: flex; align-items: center; gap: .5rem; font: 600 19px var(--sans); letter-spacing: -0.02em; text-decoration: none; }
      .workshop-top .mark bot-critter { inline-size: 2.1rem; block-size: 1.8rem; }
      .workshop-top nav { display: flex; gap: 1.4rem; align-items: center; font-size: 15px; }
      .workshop-top nav a { text-decoration: none; }
      .workshop-top nav a:not(.pill):hover { text-decoration: underline; text-underline-offset: 4px; }
      .workshop-top nav a[aria-current="page"] { font-weight: 600; }
      .workshop-top nav a.pill { background: var(--ink); color: var(--paper); border-radius: 999px; padding: .5rem 1rem; font-weight: 500; }
      .workshop-top nav a.pill:hover { background: var(--signal); }
      .workshop { max-inline-size: 90rem; margin-inline: auto; padding: 0 clamp(16px, 4vw, 48px) 3rem; }
      .workshop-head { display: flex; justify-content: space-between; align-items: end; gap: 1rem 2rem; flex-wrap: wrap; margin: .4rem 0 1.2rem; }
      .workshop-head h1 { font: 400 clamp(2.6rem, 6vw, 4.6rem)/.92 var(--serif); letter-spacing: -0.035em; margin: 0; }
      .workshop-head h1 em { color: var(--signal); }
      .workshop-head p { margin: 0; max-inline-size: 30rem; color: var(--ink-2); font-size: clamp(.98rem, 1.4vw, 1.1rem); line-height: 1.4; }
      .workshop-head p b { color: var(--ink); font-family: var(--mono); font-weight: 600; background: #c9f2e2; padding: 0 .25em; border-radius: 4px; }
      mosfet-bench { display: block; }
      .workshop-foot { max-inline-size: 90rem; margin-inline: auto; text-align: center; color: var(--ink-2); font: 500 13px var(--mono); padding: 0 16px 2.5rem; border: 0; display: block; }
      @media (max-width: 640px) { .workshop-top nav a:not(.pill) { display: none; } }
    </style>
  </head>
  <body>
    <header class="workshop-top">
      <a class="mark" href="/"><bot-critter class="mark-face" expression="happy"></bot-critter> mosfet</a>
      <nav><a href="/">home</a><a href="/workshop.html" aria-current="page">workshop</a><a href="/face.html">bot</a><a class="pill" href="/">get a bot <span aria-hidden="true">↘</span></a></nav>
    </header>
    <main class="workshop">
      <div class="workshop-head">
        <h1>The <em>workshop</em></h1>
        <p>Build a bot and give it a real job. Correct it once, in plain words — every run after that is <b>$0.00</b>, because the rule is pinned and no model gets called.</p>
      </div>
      <mosfet-bench></mosfet-bench>
    </main>
    <p class="workshop-foot">build it · run it · correct it once · it stays learned</p>
    <script type="module">
      import { defineBotCritterElement } from "/src/face/bot-critter.ts";
      import { defineMosfetBenchElement } from "/src/bench/mosfet-bench.ts";
      defineBotCritterElement();
      defineMosfetBenchElement();
    </script>
  </body>
</html>
